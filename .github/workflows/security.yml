name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit (runtime deps only)
        run: npm audit --omit=dev --audit-level=high

  agentshield:
    name: Agent config audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AgentShield
        run: npm install -g agentshield

      - name: Scan agent configs for injection/policy issues
        run: agentshield scan --format markdown
